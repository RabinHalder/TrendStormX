<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Ad</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='12218992' data-sdk='show_12218992'></script>
<style>
  body { font-family: -apple-system, sans-serif; background:#0f0f0f; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; padding:24px; box-sizing:border-box; }
  #status { color:#aaa; font-size:15px; margin:16px 0; min-height:20px; }
  button { background:#2ea043; color:#fff; border:none; padding:16px 36px; font-size:18px; border-radius:12px; display:none; }
  button.show { display:inline-block; }
</style>
</head>
<body>
<h2>📺 Watch Ad to Unlock</h2>
<p id="status">Preparing ad...</p>
<button id="watchBtn">▶️ Watch Ad</button>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  const params = new URLSearchParams(window.location.search);
  const vid = params.get("vid") || "";
  const tok = params.get("tok") || "";
  const cb  = params.get("cb") || "";
  const status = document.getElementById("status");
  const btn = document.getElementById("watchBtn");
  let started = false;

  function finish(ok) {
    if (!ok) {
      status.innerText = "❌ Ad was not completed.";
      btn.innerText = "↻ Try again";
      btn.classList.add("show");
      return;
    }
    status.innerText = "✅ Done! Closing...";
    fetch(cb, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ vid: vid, tok: tok, status: "watched" })
    }).finally(function () {
      setTimeout(function () { Telegram.WebApp.close(); }, 600);
    });
  }

  function playAd() {
    if (started) return;
    started = true;
    status.innerText = "Loading ad...";
    btn.classList.remove("show");

    let settled = false;
    const watchdog = setTimeout(function () {
      if (!settled) {
        settled = true;
        started = false;
        status.innerText = "⚠️ No ad available right now.";
        btn.innerText = "↻ Tap to retry";
        btn.classList.add("show");
      }
    }, 15000);

    show_12218992().then(function () {
      if (settled) return;
      settled = true;
      clearTimeout(watchdog);
      finish(true);
    }).catch(function () {
      if (settled) return;
      settled = true;
      started = false;
      clearTimeout(watchdog);
      finish(false);
    });
  }

  btn.addEventListener("click", playAd);

  // SDK ready howar jonno wait kore, tarpor automatic play — button chapte hobe na
  let tries = 0;
  const waitForSdk = setInterval(function () {
    tries++;
    if (typeof show_12218992 === "function") {
      clearInterval(waitForSdk);
      playAd();
    } else if (tries > 30) {
      clearInterval(waitForSdk);
      status.innerText = "⚠️ Ad network unreachable.";
      btn.innerText = "↻ Retry";
      btn.classList.add("show");
    }
  }, 500);
</script>
</body>
</html>
