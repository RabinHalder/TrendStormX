<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Ad</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='12017664' data-sdk='show_12017664'></script>
<style>
  body { font-family: -apple-system, sans-serif; background:#0f0f0f; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; padding:24px; box-sizing:border-box; }
  #status { color:#aaa; font-size:15px; margin:16px 0; min-height:20px; }
  button { background:#2ea043; color:#fff; border:none; padding:16px 36px; font-size:18px; border-radius:12px; }
  button:disabled { background:#444; opacity:0.6; }
</style>
</head>
<body>
<h2>📺 Watch Ad to Unlock</h2>
<p id="status">Preparing ad...</p>
<button id="watchBtn" disabled>▶️ Watch Ad</button>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  const params = new URLSearchParams(window.location.search);
  const vid = params.get("vid") || "";
  const tok = params.get("tok") || "";
  const cb  = params.get("cb") || "";
  const status = document.getElementById("status");
  const btn = document.getElementById("watchBtn");

  // SDK script load hote shomoy nite pare — poll kore dekhi function ready holo kina
  let tries = 0;
  const waitForSdk = setInterval(function () {
    tries++;
    if (typeof show_12017664 === "function") {
      clearInterval(waitForSdk);
      btn.disabled = false;
      status.innerText = "Tap below to watch";
    } else if (tries > 40) { // ~20 seconds
      clearInterval(waitForSdk);
      status.innerText = "⚠️ Ad network unreachable. Check connection, then reopen.";
    }
  }, 500);

  function finish(ok) {
    if (!ok) {
      status.innerText = "❌ Ad was not completed. Tap to try again.";
      btn.disabled = false;
      return;
    }
    status.innerText = "✅ Done! Closing...";
    fetch(cb, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ vid: vid, tok: tok, status: "watched" })
    }).finally(function () {
      setTimeout(function () { Telegram.WebApp.close(); }, 600);
    });
  }

  btn.addEventListener("click", function () {
    btn.disabled = true;
    status.innerText = "Loading ad...";

    if (typeof show_12017664 !== "function") {
      status.innerText = "⚠️ Ad SDK not ready. Wait a moment and retry.";
      btn.disabled = false;
      return;
    }

    let settled = false;
    const watchdog = setTimeout(function () {
      if (!settled) {
        settled = true;
        status.innerText = "⚠️ No ad available right now. Tap to retry.";
        btn.disabled = false;
      }
    }, 20000);

    show_12017664().then(function () {
      if (settled) return;
      settled = true;
      clearTimeout(watchdog);
      finish(true);
    }).catch(function () {
      if (settled) return;
      settled = true;
      clearTimeout(watchdog);
      finish(false);
    });
  });
</script>
</body>
</html>
