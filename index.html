<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Ad</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='12017664' data-sdk='show_12017664'></script>
<style>
  body { font-family: -apple-system, sans-serif; background:#0f0f0f; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; padding:24px; box-sizing:border-box; }
  #status { color:#aaa; font-size:16px; margin-top:12px; }
</style>
</head>
<body>
<h2>📺 Loading Ad…</h2>
<p id="status">Please wait</p>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  const params = new URLSearchParams(window.location.search);
  const vid = params.get("vid") || "";
  const tok = params.get("tok") || "";
  const cb  = params.get("cb") || "";
  const status = document.getElementById("status");

  function finish(ok) {
    if (!ok) {
      status.innerText = "❌ Ad was not completed. Close and try again.";
      return;
    }
    status.innerText = "✅ Done! Closing...";
    fetch(cb, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ vid: vid, tok: tok, status: "watched" })
    }).finally(function () {
      setTimeout(function () { Telegram.WebApp.close(); }, 600);
    });
  }

  show_12017664().then(function () {
    finish(true);
  }).catch(function () {
    finish(false);
  });
</script>
</body>
</html>
